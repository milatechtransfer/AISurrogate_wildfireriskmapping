# BP model on the common input pipeline -- HEX16-ONLY variant for isolated
# runtime/memory benchmarking. Identical to bp_common_input_pipeline.yaml
# except data.test_split, which points at hex16's own patches instead of
# the pooled 5-hexel test_indices.csv.
save_dir: "experiments/bp_common_input_pipeline_fuel_iROS"

modelling_approach: "1"

seed: 42
deterministic: true

model:
  num_classes: 1
  input_branches: ["spatial"]
  use_coordconv: false

optimizer:
  name: "AdamW"
  lr: 7.0e-4
  loss: ["kl", "ccc", "hex_mean_pairwise_rank", "hex_top10_pairwise_rank"]
  loss_weights:
    kl: 0.45
    ccc: 0.45
    hex_mean_pairwise_rank: 0.05
    hex_top10_pairwise_rank: 0.05

lr_scheduler:
  name: "cosine_warmup"
  warmup_epochs: 5

training:
  max_epochs: 25
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metrics: ["ccc"]
  best_ckpt_metrics_mode: ["max"]
  checkpoint_filename: "best.pth"
  bp_nodata_as_zero: true
  prediction_support_policy: "input"

data:
  root_dir: "/network/projects/amlrt_internships/nrcan_05_wildfires/burnp3plus_data/data_samples_v3"
  raw_data_dir: "/network/projects/amlrt_internships/nrcan_05_wildfires/burnp3plus_data"

  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "meta_hex_16.csv"

  batch_size: 64
  num_workers: 2
  valid_mask_threshold: 0.01
  include_patch_metadata: true

  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid_human", "ignition_grid_lightning", "fuel_grid", "elevation_grid"]
        target_name: "bp"
        out_norm: "min_max"
        fuel_feats_encoding: "iROS"
        normalize_fuel_feats_ordinal: false
        transforms_list: []
        augmentation_prob: 0.0
        terrain_derivatives: ["slope", "aspect_sin", "aspect_cos"]
        bp_nodata_as_zero: true

    - name: "spatialized_weather"
      params:
        csv_name: "weather_table_processed.csv"
        feature_names_list:
          - "Temperature"
          - "RelativeHumidity"
          - "Precipitation"
          - "FineFuelMoistureCode"
          - "DuffMoistureCode"
          - "DroughtCode"
          - "InitialSpreadIndex"
          - "BuildupIndex"
          - "FireWeatherIndex"
          - "wind_x"
          - "wind_y"
        fire_weather_zone_id_col: "WeatherZone"
        fire_weather_zone_selection_approach: "mode"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

    - name: "spatialized_fire_size"
      params:
        csv_name: "df_fire_fru_processed.csv"
        feature_names_list: ["NORM_LOG_SIZE_HA"]
        fire_weather_zone_id_col: "GRIDCODE"
        fire_weather_zone_selection_approach: "mode"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: true
  project_name: "nrcan05-wildfireriskmapping"
  workspace: "mila-amlrt"
  experiment_name: "bp_common_input_pipeline_fuel_iROS_hex16"
  tags:
    - "full_data"
    - "modelling_approach=1"
    - "target=bp"
    - "hex16_only_benchmark"
  log_every_n_step: 10

metrics:
  - "mse"
  - "mae"
  - "normalized_mae"
  - "mae_top01"
  - "mae_top02"
  - "mae_top05"
  - "mae_top10"
  - "spearman"
  - "bias"
  - "ccc"
  - "kl_div"
  - "iou_top005"
  - "iou_top01"
  - "iou_top02"
  - "iou_top05"
  - "iou_top10"
  - "auc_iou_top10"
  - "auc_iou_full"

data_prep:
  modelling_approach: 1
  win_h: 256
  win_w: 256
  overlap_ratio: 0.2
  ignition_weighting: "distribution"
  fuel_representation: "raw"
