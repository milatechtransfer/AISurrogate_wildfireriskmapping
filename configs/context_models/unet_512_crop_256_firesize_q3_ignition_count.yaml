extends: "unet_512_crop_256_firesize_q3.yaml"

save_dir: "experiments/context_models/unet_512_crop_256_firesize_q3_ignition_count"

evaluation:
  best_ckpt_metrics: ["hex/mean/ccc"]
  best_ckpt_metrics_mode: ["max"]

data:
  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid_human", "ignition_grid_lightning", "fuel_grid", "elevation_grid"]
        targets:
          - name: "bp"
            out_norm: "min_max"
          - name: "fi"
            out_norm: "log_standard"
          - name: "ros"
            out_norm: "log_standard"
        fuel_feats_encoding: "iROS"
        normalize_fuel_feats_ordinal: false
        transforms_list: []
        augmentation_prob: 0.0
        terrain_derivatives: ["slope", "aspect_sin", "aspect_cos"]
        bp_nodata_as_zero: true

    - name: "spatialized_weather"
      params:
        csv_name: "weather_table_processed.csv"
        feature_names_list:
          - "Temperature"
          - "RelativeHumidity"
          - "Precipitation"
          - "FineFuelMoistureCode"
          - "DuffMoistureCode"
          - "DroughtCode"
          - "InitialSpreadIndex"
          - "BuildupIndex"
          - "FireWeatherIndex"
          - "wind_x"
          - "wind_y"
        fire_weather_zone_id_col: "WeatherZone"
        fire_weather_zone_selection_approach: "mode"
        hex_id_col: "hex_id"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

    - name: "spatialized_fire_size"
      params:
        csv_name: "df_fire_fru_processed.csv"
        feature_names_list: ["NORM_LOG_SIZE_HA"]
        fire_weather_zone_id_col: "GRIDCODE"
        fire_weather_zone_selection_approach: "mode"
        aggregation: "mean"
        quantiles: [0.1, 0.5, 0.9]
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

    - name: "spatialized_ignition_count"
      params:
        csv_name: "ignition_count_processed.csv"
        feature_names_list:
          - "NORM_LOG1P_IGNITION_COUNT_MEAN"
          - "NORM_IGNITION_COUNT_CV"
        fire_weather_zone_id_col: "GRIDCODE"
        fire_weather_zone_selection_approach: "mode"
        hex_id_col: "hex_id"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "raise"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

logger:
  experiment_name: "unet_512_crop_256_firesize_q3_ignition_count"
  tags:
    - "ignition_count_conditioning"
    - "architecture=unet_full"
    - "ignition_spatial=legacy_distribution"
    - "ignition_count=normalized_log_mean_plus_cv"
    - "fire_size=q10_q50_q90"
    - "best_ckpt=stitched_validation_hex_mean_ccc"
    - "input_patch=512"
    - "target_crop=256"
    - "effective_batch=64"
