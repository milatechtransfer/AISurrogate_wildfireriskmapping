# Skeleton config for fine-tuning an already-trained multi-output BP/FI/ROS
# checkpoint on a new (typically smaller, regional/scenario-specific) dataset.
# Fill in the <PLACEHOLDER> values below; see the NWT fine-tuning example at
# configs/NWT_data/multi_output_NWT_eval_scenario_FireExcludeSpotting_finetune.yaml
# and the "Model Finetuning" section of README.md for more context.
save_dir: "experiments/<FINETUNE_RUN_NAME>"

modelling_approach: "1"

seed: 42
deterministic: true

model:
  num_classes: 3
  output_head: "bp_behavior"
  input_branches: ["spatial"]
  use_coordconv: false

optimizer:
  name: "AdamW"
  # Use a lower learning rate than the base/from-scratch training config to
  # avoid overfitting the (usually much smaller) fine-tuning dataset.
  lr: 5.0e-5
  target_losses:
    bp:
      loss: ["kl", "ccc", "hex_mean_pairwise_rank", "hex_top10_pairwise_rank"]
      loss_weights:
        kl: 0.45
        ccc: 0.45
        hex_mean_pairwise_rank: 0.05
        hex_top10_pairwise_rank: 0.05
      task_weight: 0.50
    fi:
      loss: ["huber", "raw_pearson"]
      loss_weights:
        huber: 0.70
        raw_pearson: 0.30
      task_weight: 0.25
    ros:
      loss: ["huber", "raw_pearson"]
      loss_weights:
        huber: 0.70
        raw_pearson: 0.30
      task_weight: 0.25

lr_scheduler:
  name: "cosine_warmup"
  warmup_epochs: 5

training:
  # Fewer epochs than base training, since fine-tuning starts from an
  # already-converged checkpoint on a (usually smaller) dataset.
  max_epochs: 20
  log_every_n_epoch: 1
  # Path to the base checkpoint to warm-start from. Only model_state is
  # loaded (optimizer/scheduler/epoch/best-metric all start fresh).
  warm_start_checkpoint: "experiments/<FINETUNE_RUN_NAME>/best_base.pth"
  # Optionally freeze submodules (e.g. encoder/bottleneck) so fine-tuning
  # only updates the remaining layers (e.g. task heads).
  # freeze_modules: ["encoder", "bottleneck"]

evaluation:
  best_ckpt_metrics: ["bp/ccc", "fi/ccc", "ros/ccc"]
  best_ckpt_metrics_mode: ["max", "max", "max"]
  # Distinct from the warm-start checkpoint's filename (best_base.pth) so the
  # fine-tuned checkpoint doesn't overwrite it.
  checkpoint_filename: "best.pth"
  bp_nodata_as_zero: true
  prediction_support_policy: "input"
  hazard_fi_cap: 10000.0
  report_to_comet: true

data:
  root_dir: "<PATH_TO_PREPARED_FINETUNE_DATASET>"
  raw_data_dir: "<PATH_TO_RAW_FINETUNE_DATA>"

  train_split: "<TRAIN_SPLIT_CSV>"
  val_split: "<VAL_SPLIT_CSV>"
  test_split: "<TEST_SPLIT_CSV>"

  # Smaller batch size than base training tends to suit smaller fine-tuning
  # datasets; adjust to fit the dataset size and available memory.
  batch_size: 16
  num_workers: 2
  valid_mask_threshold: 0.01
  include_patch_metadata: true
  # Normalization stats filename must match the fine-tuning dataset (or the
  # base dataset if reusing its stats); see src/config.py DataConfig.norm_stats_filename.
  norm_stats_filename: "dataset_norm_stats.json"

  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid_human", "ignition_grid_lightning", "fuel_grid", "elevation_grid"]
        targets:
          - name: "bp"
            out_norm: "min_max"
          - name: "fi"
            out_norm: "log_standard"
          - name: "ros"
            out_norm: "log_standard"
        fuel_feats_encoding: "iROS"
        normalize_fuel_feats_ordinal: false
        transforms_list: []
        augmentation_prob: 0.0
        terrain_derivatives: ["slope", "aspect_sin", "aspect_cos"]
        bp_nodata_as_zero: true

    - name: "spatialized_weather"
      params:
        csv_name: "weather_table_processed.csv"
        feature_names_list:
          - "Temperature"
          - "RelativeHumidity"
          - "Precipitation"
          - "FineFuelMoistureCode"
          - "DuffMoistureCode"
          - "DroughtCode"
          - "InitialSpreadIndex"
          - "BuildupIndex"
          - "FireWeatherIndex"
          - "wind_x"
          - "wind_y"
        fire_weather_zone_id_col: "WeatherZone"
        fire_weather_zone_selection_approach: "mode"
        hex_id_col: "hex_id"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: true
  project_name: "<COMET_PROJECT_NAME>"
  workspace: "<COMET_WORKSPACE>"
  experiment_name: "<FINETUNE_RUN_NAME>"
  tags:
    - "modelling_approach=1"
    - "targets=bp_fi_ros"
    - "output_head=bp_behavior"
    - "finetuning_from_base_checkpoint"
    - "ignition=aggregated_human_lightning"
    - "raw_fuel_iROS"
    - "best_ckpt=bp_ccc_fi_ccc_ros_ccc"
    - "task_weights=0.50_0.25_0.25"
    - "bp_nodata_as_zero=true"
    - "prediction_support_policy=input"
    - "tabular_fusion=spatialized"
    - "spatialized_sources=weather"
    - "terrain_derivatives=slope_aspect"
    - "wind=vector_components"
  log_every_n_step: 10

metrics:
  - "mse"
  - "mae"
  - "normalized_mae"
  - "mae_top01"
  - "mae_top02"
  - "mae_top05"
  - "mae_top10"
  - "spearman"
  - "bias"
  - "normalized_bias"
  - "ccc"
  - "iou_top005"
  - "iou_top01"
  - "iou_top02"
  - "iou_top05"
  - "iou_top10"
  - "auc_iou_top10"
  - "auc_iou_full"

data_prep:
  modelling_approach: 1
  win_h: 256
  win_w: 256
  overlap_ratio: 0.2
  ignition_weighting: "distribution"
  fuel_representation: "raw"
  mask_scope: "actual"
