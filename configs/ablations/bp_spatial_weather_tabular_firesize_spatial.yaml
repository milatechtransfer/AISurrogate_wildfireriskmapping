# BP model on the common input pipeline.
# Common input pipeline (shared by BP/FI/ROS):
#   - dataset: data_samples_v2 (aggregated 2-channel ignition: human + lightning)
#   - grid: fuel (one-hot) + elevation + terrain derivatives (slope, aspect_sin, aspect_cos)
#   - spatialized weather + fire-size with per-source missing masks
#   - wind as Cartesian components only (wind_x, wind_y); WindSpeed dropped (redundant with the norm)
#
# BP keeps its own training recipe: kl + ccc + hex pairwise-rank losses, min-max output
# normalization, bp-nodata-as-zero support, and input-only prediction support policy.
# Unlike the previous BP best model (non-spatialized tabular fed through an auxiliary MLP
# branch), BP now consumes the spatialized tabular channels on the spatial branch, matching
# FI/ROS. Spatialized input is heavier, so batch_size is 32 (was 64 for the auxiliary variant).
save_dir: "experiments/bp_spatial_weather_tabular_firesize_spatial"

modelling_approach: "1"

seed: 42
deterministic: true

model:
  num_classes: 1
  input_branches: ["spatial", "auxiliary"]
  use_coordconv: false

optimizer:
  name: "AdamW"
  lr: 7.0e-4
  loss: ["kl", "ccc", "hex_mean_pairwise_rank", "hex_top10_pairwise_rank"]
  loss_weights:
    kl: 0.45
    ccc: 0.45
    hex_mean_pairwise_rank: 0.05
    hex_top10_pairwise_rank: 0.05

lr_scheduler:
  name: "cosine_warmup"
  warmup_epochs: 5

training:
  max_epochs: 25
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metrics: ["ccc"]
  best_ckpt_metrics_mode: ["max"]
  checkpoint_filename: "best.pth"
  bp_nodata_as_zero: true
  prediction_support_policy: "input"

data:
  root_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v4"
  raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"

  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "test_indices.csv"

  batch_size: 64
  num_workers: 2
  valid_mask_threshold: 0.01
  include_patch_metadata: true

  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid_human", "ignition_grid_lightning", "fuel_grid", "elevation_grid"]
        target_name: "bp"
        out_norm: "min_max"
        fuel_feats_encoding: "iROS"
        normalize_fuel_feats_ordinal: false # set to true if using ordinal
        transforms_list: []
        augmentation_prob: 0.0
        terrain_derivatives: ["slope", "aspect_sin", "aspect_cos"]
        bp_nodata_as_zero: true

    - name: "tabular_weather"
      params:
        csv_name: "weather_table_processed.csv"
        feature_names_list: ["Temperature", "RelativeHumidity", "Precipitation", "FineFuelMoistureCode", "DuffMoistureCode", "DroughtCode",
                              "InitialSpreadIndex", "BuildupIndex", "FireWeatherIndex", "wind_x", "wind_y"]
        fire_weather_zone_id_col: "WeatherZone"
        fire_weather_zone_selection_approach: "mode" # "mode" or "weighted"
        num_samples_per_patch: 256
        hex_id_col: "hex_id"
        sampling_bias: null # null, "high_values"
        feature_to_bias: null
        transforms_list: []
        augmentation_prob: 0.0

    - name: "spatialized_fire_size"
      params:
        csv_name: "df_fire_fru_processed.csv"
        feature_names_list: ["NORM_LOG_SIZE_HA"]
        fire_weather_zone_id_col: "GRIDCODE"
        fire_weather_zone_selection_approach: "mode"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: true
  project_name: "nrcan05-wildfireriskmapping"
  workspace: "mila-amlrt"
  experiment_name: "bp_spatial_weather_tabular_firesize_spatial"
  tags:
    - "full_data"
    - "modelling_approach=1"
    - "target=bp"
    - "coordconv=patch_local"
    - "data_samples_v4"
    - "ignition=aggregated_human_lightning"
    - "raw_fuel_iROS"
    - "best_ckpt=ccc"
    - "loss=kl_ccc_hexpairrank"
    - "hex_loss_weight_total=0.10"
    - "out_norm=min_max"
    - "bp_nodata_as_zero=true"
    - "prediction_support_policy=input"
    - "tabular_fusion=spatialized"
    - "spatialized_sources=weather_fire_size"
    - "missing_masks=fire_size"
    - "terrain_derivatives=slope_aspect"
    - "wind=vector_components"
  log_every_n_step: 10

metrics:
  - "mse"
  - "mae"
  - "normalized_mae"
  - "mae_top01"
  - "mae_top02"
  - "mae_top05"
  - "mae_top10"
  - "spearman"
  - "bias"
  - "normalized_bias"
  - "ccc"
  - "kl_div"
  - "iou_top005"
  - "iou_top01"
  - "iou_top02"
  - "iou_top05"
  - "iou_top10"
  - "auc_iou_top10"
  - "auc_iou_full"

data_prep:
  modelling_approach: 1
  win_h: 256
  win_w: 256
  overlap_ratio: 0.2
  ignition_weighting: "distribution" # ("max", "distribution")
  fuel_representation: "raw" # ("raw", "group")
