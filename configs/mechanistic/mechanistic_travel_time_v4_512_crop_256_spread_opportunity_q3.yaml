extends: "../context_models/unet_512_crop_256_spread_opportunity_q3.yaml"

save_dir: "experiments/mechanistic/mechanistic_travel_time_v4_512_crop_256_spread_opportunity_q3"

model:
  architecture: "mechanistic_travel_time_v4"
  propagation_base_channels: 32
  propagation_downsample_factor: 16
  propagation_steps: 32
  propagation_cell_size_m: 100.0
  propagation_initial_ignition_scale: 0.05
  propagation_budget_temperature_hours: 4.0
  propagation_budget_min_hours: 1.0
  propagation_budget_max_hours: 140.0
  propagation_isi_bins:
    - 0.000001
    - 5.0
    - 10.0
    - 15.0
    - 20.0
    - 25.0
    - 30.0
    - 35.0
    - 40.0
    - 45.0
    - 50.0
    - 55.0
    - 60.0
    - 65.0
    - 70.0
    - 75.0
    - 80.0
    - 85.0
  propagation_isi_mean: 9.826072859968734
  propagation_isi_std: 4.01967409023783
  propagation_wind_x_mean: -2.170149045552503
  propagation_wind_x_std: 8.174554161877042
  propagation_wind_y_mean: -3.1121948890535416
  propagation_wind_y_std: 7.663523056556529
  propagation_wind_direction_is_from: true
  propagation_wind_anisotropy: 0.6931471805599453
  propagation_wind_half_saturation_kmh: 10.0
  propagation_elevation_min_m: -245.0
  propagation_elevation_max_m: 5932.0
  propagation_slope_coefficient: 3.0
  propagation_max_abs_grade: 0.5
  propagation_min_ros_m_per_min: 0.05
  propagation_speed_correction_log_limit: 0.6931471805599453
  propagation_max_bp_logit_correction: 2.0

optimizer:
  lr: 3.0e-4
  parameter_lr_scales:
    fuel_curve_encoder: 0.1
    encoder: 0.1
    bottleneck: 0.1
    decoder: 0.1
    multi_output_head: 0.1

lr_scheduler:
  warmup_epochs: 1

training:
  max_epochs: 10
  gradient_accumulation_steps: 8
  gradient_clip_norm: 1.0
  freeze_pretrained_epochs: 1
  initial_checkpoint: "${SCENARIO_UNET_CHECKPOINT}"

evaluation:
  best_ckpt_metrics: ["mean/ccc"]
  best_ckpt_metrics_mode: ["max"]

logger:
  experiment_name: "mechanistic_travel_time_v4_512_crop_256_spread_opportunity_q3"
  tags:
    - "mechanistic_travel_time_v4"
    - "warm_start=scenario_unet_512_crop_256_spread_q3"
    - "mechanistic_target=bp_only"
    - "travel_grid=32x32"
    - "propagation_steps=32"
    - "coarse_cell_m=1600"
    - "edge_time=half_source_half_destination"
    - "budget=source_carried_q10_q50_q90"
    - "directional_ros=iros_wind_slope_bounded_cnn"
    - "wind_direction=meteorological_from"
    - "wind_units=kmh"
    - "zero_initialized_bp_residual"
    - "freeze_pretrained_epochs=1"
    - "finetune_epochs=10"
    - "best_ckpt=mean_ccc"
    - "input_patch=512"
    - "target_crop=256"
    - "effective_batch=64"
