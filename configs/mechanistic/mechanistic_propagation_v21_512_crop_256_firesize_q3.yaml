extends: "physical_bp_512_crop_256_firesize_q3.yaml"

save_dir: "experiments/mechanistic/mechanistic_propagation_v21_512_crop_256_firesize_q3"

model:
  architecture: "mechanistic_propagation_v21"
  propagation_base_channels: 48
  propagation_downsample_factor: 8
  propagation_steps: 24
  propagation_cell_size_m: 100.0
  propagation_survival_sharpness: 6.0
  propagation_min_area_multiplier: 0.05
  propagation_max_area_multiplier: 20.0
  propagation_initial_ignition_scale: 0.05
  propagation_max_ignition_scale: 1.0
  propagation_initial_bp_scale: 0.1
  propagation_max_local_log_calibration: 0.22314355131420976

optimizer:
  lr: 3.0e-4
  parameter_lr_scales:
    raw_ignition_scale: 0.1
    raw_bp_scale: 0.1
    propagation.raw_area_multiplier: 0.1
    bp_local_calibration: 0.25

lr_scheduler:
  warmup_epochs: 2

training:
  gradient_accumulation_steps: 16
  gradient_clip_norm: 1.0

evaluation:
  best_ckpt_metrics: ["mean/ccc"]
  best_ckpt_metrics_mode: ["max"]

logger:
  experiment_name: "mechanistic_propagation_v21_512_crop_256_firesize_q3"
  tags:
    - "mechanistic_propagation_v21"
    - "stopping=fire_size_q10_q50_q90"
    - "behavior_gradients=detached_from_propagation"
    - "mechanistic_scalar_lr_scale=0.1"
    - "gradient_clip_norm=1"
    - "bp_local_calibration=0.8_to_1.25"
    - "best_ckpt=mean_ccc"
    - "input_patch=512"
    - "target_crop=256"
    - "target_stride=204"
    - "effective_batch=64"
    - "bp_target=physical_probability"
