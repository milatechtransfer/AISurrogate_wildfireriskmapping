save_dir: "experiments/mechanistic/mechanistic_hybrid_v22_native_512_crop_256_firesize_q3"

modelling_approach: "1"
seed: 42
deterministic: true

model:
  architecture: "mechanistic_hybrid_v22"
  num_classes: 3
  output_head: "bp_behavior"
  input_branches: ["spatial"]
  auxiliary_embed_dims:
    fuel_curve: 8

  propagation_base_channels: 48
  propagation_downsample_factor: 8
  propagation_steps: 16
  propagation_cell_size_m: 100.0
  propagation_logit_eps: 1.0e-6
  propagation_ignition_mode: "probability_mass"
  propagation_ignition_probability_mass_scale: 1000000.0
  propagation_count_log_mean_min: 0.7347688552507647
  propagation_count_log_mean_max: 3.336054233329951
  propagation_count_cv_min: 0.37751471592829855
  propagation_count_cv_max: 1.3789218959893028
  propagation_scenario_mode: "fire_size"
  propagation_fire_size_log_min: 0.0
  propagation_fire_size_log_max: 6.021189712683533
  propagation_budget_temperature_hours: 2.0
  propagation_isi_bins:
    - 0.000001
    - 5.0
    - 10.0
    - 15.0
    - 20.0
    - 25.0
    - 30.0
    - 35.0
    - 40.0
    - 45.0
    - 50.0
    - 55.0
    - 60.0
    - 65.0
    - 70.0
    - 75.0
    - 80.0
    - 85.0
  propagation_isi_mean: 9.826072859968734
  propagation_isi_std: 4.01967409023783
  propagation_wind_x_mean: -2.170149045552503
  propagation_wind_x_std: 8.174554161877042
  propagation_wind_y_mean: -3.1121948890535416
  propagation_wind_y_std: 7.663523056556529
  propagation_wind_direction_is_from: true
  propagation_wind_anisotropy: 1.3862943611198906
  propagation_wind_anisotropy_min: 0.0
  propagation_wind_anisotropy_max: 2.0794415416798357
  propagation_wind_half_saturation_kmh: 10.0
  propagation_elevation_min_m: -245.0
  propagation_elevation_max_m: 5932.0
  propagation_slope_coefficient: 3.0
  propagation_max_abs_grade: 0.5
  propagation_min_ros_m_per_min: 0.05
  propagation_speed_correction_log_limit: 0.6931471805599453
  propagation_max_local_log_calibration: 0.4054651081081644
  propagation_quantile_kl_weight: 1.0e-2
  propagation_behavior_consistency_weight: 2.0e-2

  interpretable_initial_per_fire_reach_scale: 1.0
  interpretable_min_per_fire_reach_scale: 0.5
  interpretable_max_per_fire_reach_scale: 2.0
  interpretable_source_grid_size: 4
  interpretable_fi_log_mean: 7.9690247380067625
  interpretable_fi_log_std: 1.144906248575859
  interpretable_ros_log_mean: 1.7871663060985448
  interpretable_ros_log_std: 0.5520388934154877

optimizer:
  name: "AdamW"
  lr: 5.0e-4
  parameter_lr_scales:
    raw_per_fire_reach_scale: 0.25
    raw_wind_anisotropy: 0.25
    raw_quantile_logits: 0.25
  target_losses:
    bp:
      loss: ["kl", "ccc", "hex_mean_pairwise_rank", "hex_top10_pairwise_rank"]
      loss_weights:
        kl: 0.45
        ccc: 0.45
        hex_mean_pairwise_rank: 0.05
        hex_top10_pairwise_rank: 0.05
      task_weight: 0.50
    fi:
      loss: ["huber", "raw_pearson"]
      loss_weights:
        huber: 0.70
        raw_pearson: 0.30
      task_weight: 0.25
    ros:
      loss: ["huber", "raw_pearson"]
      loss_weights:
        huber: 0.70
        raw_pearson: 0.30
      task_weight: 0.25

lr_scheduler:
  name: "cosine_warmup"
  warmup_epochs: 5

training:
  max_epochs: 40
  log_every_n_epoch: 1
  gradient_accumulation_steps: 16
  gradient_clip_norm: 1.0
  initial_checkpoint: null
  freeze_pretrained_epochs: 0

evaluation:
  best_ckpt_metrics: ["hex/mean/ccc"]
  best_ckpt_metrics_mode: ["max"]
  checkpoint_filename: "best.pth"
  bp_nodata_as_zero: true
  prediction_support_policy: "input"
  hazard_fi_cap: 10000.0

data:
  root_dir: "/network/scratch/o/olutayot/nrcan_wildfireriskmapping/data_samples/data_samples_v6_native_context_512_crop_256_ignition_probability_mass"
  raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"
  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "test_indices.csv"
  batch_size: 4
  num_workers: 4
  valid_mask_threshold: 0.01
  include_patch_metadata: true
  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid_human", "ignition_grid_lightning", "fuel_grid", "elevation_grid"]
        targets:
          - name: "bp"
            out_norm: "none"
          - name: "fi"
            out_norm: "log_standard"
            log_mean: 7.9690247380067625
            log_std: 1.144906248575859
          - name: "ros"
            out_norm: "log_standard"
            log_mean: 1.7871663060985448
            log_std: 0.5520388934154877
        fuel_feats_encoding: "iROS_HFI"
        normalize_fuel_feats_ordinal: false
        transforms_list: []
        augmentation_prob: 0.0
        terrain_derivatives: []
        terrain_cell_size_m: 100.0
        bp_nodata_as_zero: true

    - name: "spatialized_weather"
      params:
        csv_name: "weather_table_processed.csv"
        feature_names_list: ["InitialSpreadIndex", "wind_x", "wind_y"]
        fire_weather_zone_id_col: "WeatherZone"
        fire_weather_zone_selection_approach: "mode"
        hex_id_col: "hex_id"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

    - name: "spatialized_fire_size"
      params:
        csv_name: "df_fire_fru_processed.csv"
        feature_names_list: ["NORM_LOG_SIZE_HA"]
        fire_weather_zone_id_col: "GRIDCODE"
        fire_weather_zone_selection_approach: "mode"
        aggregation: "mean"
        quantiles: [0.1, 0.5, 0.9]
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "global_mean"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

    - name: "spatialized_ignition_count"
      params:
        csv_name: "ignition_count_processed.csv"
        feature_names_list:
          - "NORM_LOG1P_IGNITION_COUNT_MEAN"
          - "NORM_IGNITION_COUNT_CV"
        fire_weather_zone_id_col: "GRIDCODE"
        fire_weather_zone_selection_approach: "mode"
        hex_id_col: "hex_id"
        aggregation: "mean"
        zone_channel_key: "firezones_grid"
        missing_value_strategy: "raise"
        include_missing_firezone_mask: false
        shuffle_lut: false
        shuffle_seed: 42
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: true
  project_name: "nrcan05-wildfireriskmapping"
  workspace: "mila-amlrt"
  experiment_name: "mechanistic_hybrid_v22_native_512_crop_256_firesize_q3"
  tags:
    - "mechanistic_hybrid_v22"
    - "training=scratch"
    - "seed=42"
    - "grid=native_100m"
    - "input_patch=512"
    - "target_crop=256"
    - "effective_batch=64"
    - "fuel=iROS_HFI"
    - "ignition=exact_probability_mass"
    - "ignition_count=mean_plus_cv_pgf"
    - "propagation=source_factorized_travel_time"
    - "propagation_steps=16"
    - "fire_size=q10_q50_q90_learned_prior"
    - "bp=physical_hazard_bounded_correction"
    - "behavior=learned_heads_with_physical_consistency"
    - "best_ckpt=stitched_validation_hex_mean_ccc"
  log_every_n_step: 10

metrics:
  - "mse"
  - "mae"
  - "normalized_mae"
  - "mae_top01"
  - "mae_top02"
  - "mae_top05"
  - "mae_top10"
  - "spearman"
  - "bias"
  - "normalized_bias"
  - "ccc"
  - "iou_top005"
  - "iou_top01"
  - "iou_top02"
  - "iou_top05"
  - "iou_top10"
  - "auc_iou_top10"
  - "auc_iou_full"

data_prep:
  modelling_approach: 1
  win_h: 512
  win_w: 512
  target_crop_h: 256
  target_crop_w: 256
  overlap_ratio: 0.2
  ignition_weighting: "probability_mass"
  fuel_representation: "raw"
  preserve_native_grid: true
