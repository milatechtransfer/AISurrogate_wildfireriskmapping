# Fixed-model input counterfactual smoke config focused on hex16.
#
# This config defines the experiment scope only.  Weather editing, fuel editing,
# model inference, and paired metrics are implemented in subsequent modules.

raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"
save_dir: "experiments/counterfactual_hex16"

hex_ids: ["16"]
focus_hex_id: "16"
mask_scope: "actual"
support_policy: "baseline"
seed: 42

endpoints:
  bp:
    enabled: true
    config_path: "configs/bp_common_input_pipeline.yaml"
  ros:
    enabled: true
    config_path: "configs/ros_common_input_pipeline.yaml"
  fi:
    enabled: true
    config_path: "configs/fi_common_input_pipeline.yaml"

scenarios:
  - name: baseline
    kind: baseline
    description: Original model inputs; paired-delta reference.
    params: {}
  - name: wind_roundtrip_placebo
    kind: wind
    description: Reconstruct baseline wind columns from raw values and baseline scaling; predictions should match baseline.
    params:
      mode: roundtrip_placebo
  - name: wind_from_west_p95
    kind: wind
    description: Force high but empirical wind coming from the west, so physical flow is toward the east.
    params:
      mode: fixed_from_bearing
      wind_from_bearing_deg: 270.0
      speed_percentile: 95.0
  - name: wind_speed50_original_direction
    kind: wind
    description: Force very high wind speed while retaining each raw weather row's original wind direction.
    params:
      mode: speed_only_high
      fixed_speed: 50.0
  - name: wind_zone_consistent_direction
    kind: wind
    description: Preserve wind speeds but set each weather zone to its speed-weighted dominant source direction.
    params:
      mode: zone_dominant_direction
      zone_column: WeatherZone
  - name: wind_speed50_zone_consistent_direction
    kind: wind
    description: Force WindSpeed=50 and set each weather zone to its speed-weighted dominant source direction.
    params:
      mode: zone_dominant_direction
      zone_column: WeatherZone
      fixed_speed: 50.0
  - name: wind_speed100_zone_consistent_direction
    kind: wind
    description: Stress-test WindSpeed=100 with each weather zone set to its speed-weighted dominant source direction.
    params:
      mode: zone_dominant_direction
      zone_column: WeatherZone
      fixed_speed: 100.0
  - name: remove_barriers_adjacent_modal
    kind: fuel
    description: Replace each connected non-fuel barrier component with its local adjacent modal burnable fuel.
    params:
      mode: nonfuel_to_burnable_local_adjacent_modal
  - name: fwi_daily_low_to_high
    kind: fwi
    description: Per zone, replace low-FWI daily rows with sampled high-FWI rows (raise the zone weather regime).
    params:
      mode: daily_regime_swap
      direction: low_to_high
      low_quantile: 33.0
      high_quantile: 66.0
      zone_column: WeatherZone
  - name: fwi_daily_high_to_low
    kind: fwi
    description: Per zone, replace high-FWI daily rows with sampled low-FWI rows (dampen the zone weather regime).
    params:
      mode: daily_regime_swap
      direction: high_to_low
      low_quantile: 33.0
      high_quantile: 66.0
      zone_column: WeatherZone
  - name: fwi_summary_low_to_high
    kind: fwi
    description: Overwrite low-summary-FWI zones with the donor high-summary-FWI zone profile.
    params:
      mode: summary_zone_swap
      direction: low_to_high
      low_quantile: 33.0
      high_quantile: 66.0
      zone_column: WeatherZone
  - name: fwi_summary_high_to_low
    kind: fwi
    description: Overwrite high-summary-FWI zones with the donor low-summary-FWI zone profile.
    params:
      mode: summary_zone_swap
      direction: high_to_low
      low_quantile: 33.0
      high_quantile: 66.0
      zone_column: WeatherZone
