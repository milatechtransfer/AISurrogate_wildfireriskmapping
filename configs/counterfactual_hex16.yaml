# Fixed-model input counterfactual smoke config focused on hex16.
#
# This config defines the experiment scope only.  Weather editing, fuel editing,
# model inference, and paired metrics are implemented in subsequent modules.

raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"
save_dir: "experiments/counterfactual_hex16"

hex_ids: ["16"]
focus_hex_id: "16"
mask_scope: "actual"
support_policy: "baseline"
seed: 42

endpoints:
  bp:
    enabled: true
    config_path: "configs/bp_common_input_pipeline.yaml"
  ros:
    enabled: true
    config_path: "configs/ros_common_input_pipeline.yaml"
  fi:
    enabled: true
    config_path: "configs/fi_common_input_pipeline.yaml"

scenarios:
  - name: baseline
    kind: baseline
    description: Original model inputs; paired-delta reference.
    params: {}
  - name: remove_barriers_adjacent_modal
    kind: fuel
    description: Replace each connected non-fuel barrier component with its local adjacent modal burnable fuel.
    params:
      mode: nonfuel_to_burnable_local_adjacent_modal
  - name: fwi_daily_low_to_high
    kind: fwi
    description: Per zone, replace low-FWI daily rows with sampled high-FWI rows (raise the zone weather regime).
    params:
      mode: daily_regime_swap
      direction: low_to_high
      low_quantile: 33.0
      high_quantile: 66.0
      zone_column: WeatherZone
  - name: fwi_daily_high_to_low
    kind: fwi
    description: Per zone, replace high-FWI daily rows with sampled low-FWI rows (dampen the zone weather regime).
    params:
      mode: daily_regime_swap
      direction: high_to_low
      low_quantile: 33.0
      high_quantile: 66.0
      zone_column: WeatherZone
  - name: wind_zone_peak_day
    kind: wind_regime
    description: Per zone, transplant the single highest-WindSpeed day's full weather regime onto every day in the zone.
    params:
      mode: zone_peak_transplant
      zone_column: WeatherZone
  - name: wind_dir_dominant
    kind: wind_direction
    description: Set every day to the hex's speed-weighted dominant from-bearing (per-day speeds kept); spatial-pattern probe.
    params:
      mode: uniform_direction
      offset_deg: 0.0
  - name: wind_dir_dominant_opposite
    kind: wind_direction
    description: Set every day to the exact opposite (180 deg) of the dominant from-bearing; mirror test for the spatial response.
    params:
      mode: uniform_direction
      offset_deg: 180.0
  - name: remove_barriers_wind_opposite
    kind: composite
    description: Combine non-fuel barrier removal with the dominant-opposite wind direction to probe their joint spatial ROS response.
    params:
      edits:
        - kind: fuel
          params:
            mode: nonfuel_to_burnable_local_adjacent_modal
        - kind: wind_direction
          params:
            mode: uniform_direction
            offset_deg: 180.0
