raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"
save_dir: "experiments/counterfactual_fuel_polygons_10seasons_multi_output_hex16_q3_256"
hex_ids: ["16"]

# Single multi-output checkpoint jointly predicting bp/fi/ros.
endpoints:
  bp:
    config_path: "configs/multi_output_spatial_weather_firesize_q3.yaml"
    checkpoint_dir: "/network/projects/amlrt/nrcan_wildfires/checkpoints/burnp3plus/final_experiments/unet_256_firesize_q3"
  fi:
    config_path: "configs/multi_output_spatial_weather_firesize_q3.yaml"
    checkpoint_dir: "/network/projects/amlrt/nrcan_wildfires/checkpoints/burnp3plus/final_experiments/unet_256_firesize_q3"
  ros:
    config_path: "configs/multi_output_spatial_weather_firesize_q3.yaml"
    checkpoint_dir: "/network/projects/amlrt/nrcan_wildfires/checkpoints/burnp3plus/final_experiments/unet_256_firesize_q3"

scenarios:
  - name: "baseline"
    kind: "baseline"
    description: "Unmodified prepared fuel inputs."

  # Replacement fuel 13 is the D-1/D-2 aspen pair, blended per hexel by its season
  # weights. Code 12 (pure D-2 green) is deliberately not used: its curve is
  # identically zero, so the model cannot distinguish it from a non-fuel barrier.
  - name: "burn_scars_10_seasons_to_aspen"
    kind: "fuel"
    description: "Convert every burnable pixel inside the final BurnP3+ fire perimeters of simulated seasons 1-10 (165 fires, ~2.3% of hex16 burnable area on the BurnP3+ grid) to D-1/D-2 aspen. Ten seasons approximates a recent-scar window in which burned stands regrow as deciduous; NRCan review found 500 seasons (5,681 fires, ~33%) and 20 seasons (265 fires, ~3.2%) overstated the intervention."
    params:
      mode: "burnable_to_burnable_fixed"
      nonfuel_ids: [100, 101, 102, 105, 106, 110]
      # source_fuel_ids omitted => every burnable pixel inside the mask is converted.
      replacement_fuel_id: 13
      fire_polygons:
        path: "/network/projects/amlrt_internships/nrcan_05_wildfires/bp3+_500iter/burn-perimeters.gpkg"
        layer: "final_burn_perimeters"
        # This layer was already reduced to one final footprint per fire.
        final_perimeter_only: false
        buffer_m: 0
        select:
          iteration_range: [1, 10]
