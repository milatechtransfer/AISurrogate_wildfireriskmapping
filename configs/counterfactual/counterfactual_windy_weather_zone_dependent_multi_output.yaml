raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"
save_dir: "experiments/counterfactual_windy_weather_zone_dependent_multi_output_hex16"
hex_ids: ["16"]
nonfuel_ids: [100, 101, 102, 105, 106, 110]

# Single multi-output checkpoint jointly predicting bp/fi(/ros). See
# counterfactual_windy_weather_multi_output.yaml for details on this pattern.
endpoints:
  bp:
    config_path: "configs/multi_output_spatial_weather.yaml"
  fi:
    config_path: "configs/multi_output_spatial_weather.yaml"
  ros:
    config_path: "configs/multi_output_spatial_weather.yaml"

scenarios:
  - name: "baseline"
    kind: "baseline"
    description: "Unmodified prepared weather inputs."

  - name: "windy_self_transplant_zone_dependent"
    kind: "weather"
    description: "Zone-dependent variant of windy_self_transplant: each hex16 WeatherZone is assigned the mean processed-weather vector of its own windiest rows (top 10%, wind_speed_percentile=90) instead of one hex-wide donor mean broadcast to every zone, preserving zone-to-zone wind climatology differences."
    params:
      mode: "windy_mean_zone_dependent_transplant"
      donor_hex_ids: ["16"]
      wind_speed_percentile: 90

  - name: "windy_self_transplant_zone_dependent_s1"
    kind: "weather"
    description: "Season-restricted variant of windy_self_transplant_zone_dependent: each hex16 WeatherZone's windiest rows (top 10%, wind_speed_percentile=90) resolved within Season 1 only (hex16_Seasons.csv: Julian day 121-211, ~Apr 30-Jul 29, spring/early summer)."
    params:
      mode: "windy_mean_zone_dependent_transplant"
      donor_hex_ids: ["16"]
      wind_speed_percentile: 90
      season: 1

  - name: "windy_self_transplant_zone_dependent_s2"
    kind: "weather"
    description: "Season-restricted variant of windy_self_transplant_zone_dependent: each hex16 WeatherZone's windiest rows (top 10%, wind_speed_percentile=90) resolved within Season 2 only (hex16_Seasons.csv: Julian day 212+, ~Jul 30 onward, summer/fall)."
    params:
      mode: "windy_mean_zone_dependent_transplant"
      donor_hex_ids: ["16"]
      wind_speed_percentile: 90
      season: 2
